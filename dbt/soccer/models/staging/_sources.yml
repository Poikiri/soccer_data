version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: matches
        loaded_at_field: ingested_at
        freshness:
          warn_after: { count: 4, period: day }
          error_after: { count: 8, period: day }
      # sb_matches/sb_events are a static historical pull (StatsBomb open data),
      # not on a schedule -- no freshness check.
      - name: sb_matches
      - name: sb_events

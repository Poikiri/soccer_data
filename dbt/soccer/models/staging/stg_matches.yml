version: 2

models:
  - name: stg_matches
    description: One row per match, cleaned and typed from raw.matches.
    columns:
      - name: match_id
        description: Surrogate key (md5 of division, date, home team, away team).
        tests:
          - not_null
          - unique
      - name: match_date
        tests:
          - not_null
      - name: home_team
        tests:
          - not_null
      - name: away_team
        tests:
          - not_null
      - name: result
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["H", "D", "A"]
